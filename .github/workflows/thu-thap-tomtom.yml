name: Thu thap du lieu TomTom

# Chay tren ha tang GitHub, KHONG can may ca nhan bat 24/24.
#
# ---------------------------------------------------------------------------
# THIET KE LICH - da doi ngay 02/09/2026 sau khi thu nghiem that bai
# ---------------------------------------------------------------------------
# Lan dau dung cron 10-20 phut/lan. Ket qua: sau 95 phut, 0 lan chay tu dong.
# Nguyen nhan: GitHub ghi ro su kien `schedule` co the bi hoan hoac BO QUA
# khi he thong tai cao, va lich duoi 1 gio thuc te rat khong dang tin,
# dac biet voi repo cong khai o goi mien phi.
#
# Thiet ke moi: chi dua vao cron MOI GIO (tang dang tin cay cao hon han),
# va lay nhieu mau NGAY TRONG mot lan chay bang vong lap noi bo.
#   - Cron chay luc phut :05 moi gio  (tranh dau gio la luc GitHub dong nhat)
#   - Moi lan chay: goi API 3 lan, cach nhau 15 phut  -> ~:05, :20, :35
#   - Job keo dai ~31 phut, commit mot lan o cuoi
#
# Loi ich: van giu do phan giai 15 phut, nhung chi can cron moi gio chay dung.
# Neu mot gio bi bo qua, chi mat 1 gio du lieu chu khong mat ca ngay.
#
# Quota TomTom: 3 lan/gio x 24 gio x 12 doan = 864 request/ngay,
# nam gon trong han muc mien phi 2.500/ngay, con du mo rong len ~30 doan.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: '5 * * * *'     # moi gio, phut thu 5
  workflow_dispatch:        # bam chay tay de test

  # PHUONG AN DU PHONG - cong kich hoat tu ben ngoai.
  # GitHub ghi ro su kien schedule co the bi hoan hoac bo qua khi he thong
  # tai cao; lich duoi 1 gio rat khong dang tin. Neu schedule khong on dinh,
  # dung mot dich vu cron mien phi ben ngoai (vd cron-job.org) goi:
  #
  #   POST https://api.github.com/repos/bugkodc/Danang-traffic-analytics/dispatches
  #   Header: Authorization: Bearer <PAT co quyen repo>
  #           Accept: application/vnd.github+json
  #   Body:   {"event_type": "thu-thap"}
  #
  # Dich vu cron ben ngoai chay dung gio hon GitHub scheduler nhieu.
  repository_dispatch:
    types: [thu-thap]

# Chan hai lan chay chong len nhau gay xung dot khi commit
concurrency:
  group: thu-thap-tomtom
  cancel-in-progress: false

jobs:
  thu-thap:
    runs-on: ubuntu-latest
    timeout-minutes: 45     # job chay ~31 phut, dat nguong an toan
    permissions:
      contents: write       # can quyen ghi de commit du lieu nguoc lai repo

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cai thu vien
        run: pip install --quiet requests pandas pyarrow

      - name: Goi API 3 lan, cach nhau 15 phut
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
        working-directory: ingest/tomtom
        run: |
          for i in 1 2 3; do
            echo "--- Lan lay mau $i/3 ---"
            python collect.py || echo "Lan $i that bai, bo qua va di tiep"
            if [ $i -lt 3 ]; then
              echo "Cho 15 phut den lan tiep theo..."
              sleep 900
            fi
          done

      - name: Commit du lieu
        run: |
          git config user.name  "tomtom-collector"
          git config user.email "actions@github.com"
          git add ingest/tomtom/data/
          if git diff --staged --quiet; then
            echo "Khong co du lieu moi."
            exit 0
          fi
          git commit -m "du lieu tomtom $(date -u +'%Y-%m-%d %H:%M UTC')"
          # thu day toi 5 lan, rebase neu co lan chay khac vua commit truoc
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push && exit 0
            echo "Lan $i that bai, thu lai sau 10s..."
            sleep 10
          done
          echo "Khong day duoc sau 5 lan thu."
          exit 1

<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đà Nẵng Traffic Analytics — 3D Visuals</title>
<link rel="stylesheet" href="/static/vendor/Cesium/Widgets/widgets.css">
<style>
  :root{
    --bg:#070b12; --panel:rgba(15, 23, 42, 0.88); --panel-border:rgba(51, 65, 85, 0.7);
    --text:#f8fafc; --dim:#94a3b8; --accent:#38bdf8; --accent-glow:rgba(56, 189, 248, 0.35);
    --m1:#22c55e; --m2:#eab308; --m3:#f97316; --m4:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;
  }

  /* Glassmorphism Header */
  header{
    padding:10px 18px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--panel-border);display:flex;align-items:center;gap:12px;flex-wrap:wrap;z-index:20;
    box-shadow:0 4px 20px rgba(0,0,0,0.5);
  }
  .brand{display:flex;align-items:center;gap:8px}
  .brand h1{font-size:15px;font-weight:700;letter-spacing:-0.01em;color:#fff}
  .brand .tag{
    font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
    background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;padding:2px 7px;border-radius:4px;
    box-shadow:0 0 10px rgba(56,189,248,0.45);
  }
  header .sub{color:var(--dim);font-size:12px}

  .ctrl-group{display:flex;align-items:center;gap:6px;margin-left:auto}
  .ctrl-group label{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:0.04em}
  .select-box, header button{
    background:rgba(30, 41, 59, 0.9);color:var(--text);border:1px solid var(--panel-border);
    border-radius:6px;padding:5px 11px;cursor:pointer;font-size:12px;transition:all .18s ease;outline:none;
  }
  .select-box:hover, header button:hover{border-color:var(--accent);background:rgba(51, 65, 85, 0.95)}
  header button.active{background:#0284c7;border-color:var(--accent);color:#fff;box-shadow:0 0 12px var(--accent-glow)}

  main{flex:1;display:flex;min-height:0;position:relative}
  #ce{flex:1;position:relative;background:#050811}
  #tai{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:rgba(7,11,18,0.85);backdrop-filter:blur(10px);color:var(--text);font-size:13px;z-index:30;
    line-height:1.9;text-align:center;
  }
  .spinner{
    width:36px;height:36px;border:3px solid rgba(56,189,248,0.2);border-top-color:var(--accent);
    border-radius:50%;animation:spin 0.75s linear infinite;margin-bottom:14px;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Sidebar */
  aside{
    width:345px;background:var(--panel);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    border-left:1px solid var(--panel-border);overflow-y:auto;padding:16px;flex:none;z-index:10;
    display:flex;flex-direction:column;gap:14px;box-shadow:-6px 0 24px rgba(0,0,0,0.4);
  }
  aside::-webkit-scrollbar{width:5px}
  aside::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.3);border-radius:3px}

  .bar{
    padding:10px 18px;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--panel-border);display:flex;align-items:center;gap:14px;z-index:20;
  }
  .bar input[type=range]{flex:1;accent-color:var(--accent);cursor:pointer;height:5px}
  .bar .tstamp{font-variant-numeric:tabular-nums;min-width:180px;color:var(--text);font-weight:500;text-align:right}

  h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);font-weight:600}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi div{
    background:rgba(15, 23, 42, 0.75);border:1px solid rgba(51, 65, 85, 0.5);border-radius:8px;
    padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .kpi b{display:block;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;color:#fff}
  .kpi span{font-size:11px;color:var(--dim)}

  .legend{
    display:flex;gap:10px;font-size:11.5px;color:var(--dim);flex-wrap:wrap;background:rgba(15, 23, 42, 0.5);
    padding:8px 10px;border-radius:6px;border:1px solid rgba(51, 65, 85, 0.4);
  }
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 6px currentColor}

  .seg-list{max-height:220px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding-right:2px}
  .seg-list::-webkit-scrollbar{width:4px}
  .seg-list::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.25);border-radius:2px}

  .seg{
    padding:8px 11px;border:1px solid rgba(51, 65, 85, 0.5);border-radius:7px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(15, 23, 42, 0.65);
    transition:all .15s ease;
  }
  .seg:hover{border-color:var(--accent);background:rgba(30, 41, 59, 0.9);transform:translateX(2px)}
  .seg.on{border-color:var(--accent);background:rgba(2, 132, 199, 0.3);box-shadow:0 0 10px rgba(56,189,248,0.25)}
  .seg .nm{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
  .seg .sp{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--dim);white-space:nowrap}

  #bd{width:100%;height:145px;background:rgba(15, 23, 42, 0.85);border:1px solid var(--panel-border);border-radius:8px}
  .err{color:#fca5a5;font-size:12px;padding:12px;border:1px solid #7f1d1d;border-radius:8px;background:rgba(28,16,19,0.85);line-height:1.7}
  .err code{background:#0f1419;padding:2px 5px;border-radius:3px;color:#e6edf3;font-size:11px}

  /* Overlay View Presets on Map */
  .map-shortcuts{
    position:absolute;top:16px;left:16px;z-index:15;display:flex;gap:6px;
    background:rgba(15, 23, 42, 0.8);backdrop-filter:blur(10px);padding:6px;border-radius:8px;
    border:1px solid rgba(51,65,85,0.65);box-shadow:0 4px 16px rgba(0,0,0,0.45);
  }
  .map-shortcuts button{
    background:transparent;color:var(--text);border:none;border-radius:5px;padding:5px 9px;
    cursor:pointer;font-size:11.5px;font-weight:500;transition:all .15s ease;
  }
  .map-shortcuts button:hover{background:rgba(56,189,248,0.25);color:var(--accent)}

  .cesium-viewer-bottom,.cesium-widget-credits{display:none !important}
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Đà Nẵng Traffic Analytics</h1>
    <span class="tag">Photorealistic 3D</span>
  </div>
  <span class="sub" id="tomtat">đang tải dữ liệu…</span>
  <span class="sub" id="tt-bd" style="margin-left:auto">…</span>

  <div class="ctrl-group">
    <label>Nền:</label>
    <select id="sel-nen" class="select-box" onchange="doiNenBanDo(this.value)">
      <option value="satellite" selected>🛰️ Vệ tinh (Esri)</option>
      <option value="dark">🌃 Đêm (Carto)</option>
      <option value="offline">🌐 Ngoại tuyến</option>
    </select>
  </div>

  <div class="ctrl-group">
    <label>Địa hình:</label>
    <button id="nut-terrain" onclick="chuyenDiaHinh()">⛰️ Đồi núi 3D: Tắt</button>
  </div>

  <button onclick="veGiua()">Về giữa</button>
  <button onclick="doiGocNhin()" id="nut-goc">Nghiêng 3D</button>
</header>

<main>
  <div id="ce">
    <div class="map-shortcuts">
      <button onclick="bayViTri('overview')">Toàn cảnh</button>
      <button onclick="bayViTri('son_tra')">Bán đảo Sơn Trà</button>
      <button onclick="bayViTri('cau_rong')">Cầu Rồng</button>
      <button onclick="bayViTri('cau_song_han')">Cầu Sông Hàn</button>
      <button onclick="bayViTri('nga_ba_hue')">Ngã ba Huế</button>
      <button onclick="bayViTri('my_khe')">Bãi biển Mỹ Khê</button>
    </div>
    <div id="tai">
      <div class="spinner"></div>
      <div id="tai-text">Đang tải bản đồ vệ tinh & dữ liệu giao thông Đà Nẵng…</div>
    </div>
  </div>

  <aside id="aside">
    <h2>Tổng quan dữ liệu</h2>
    <div class="kpi" id="kpi"></div>

    <h2>Mức tắc nghẽn</h2>
    <div class="legend">
      <span><i style="background:var(--m1);color:var(--m1)"></i>Thông thoáng</span>
      <span><i style="background:var(--m2);color:var(--m2)"></i>Hơi đông</span>
      <span><i style="background:var(--m3);color:var(--m3)"></i>Đông</span>
      <span><i style="background:var(--m4);color:var(--m4)"></i>Tắc</span>
    </div>

    <h2>Các đoạn đo</h2>
    <div class="seg-list" id="ds"></div>

    <h2 id="tieude-bd">Chuỗi thời gian</h2>
    <canvas id="bd" width="620" height="300"></canvas>
    <p style="margin-top:2px;color:var(--dim);font-size:11px">Chọn một đoạn để xem diễn biến tốc độ.</p>
  </aside>
</main>

<div class="bar">
  <span>Thời điểm đo</span>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="tstamp" id="nhan">&mdash;</span>
</div>

<script>window.CESIUM_BASE_URL = '/static/vendor/Cesium/';</script>
<script src="/static/vendor/Cesium/Cesium.js"></script>
<script>
/* ---------------------------------------------------------------------------
   Da Nang Traffic Analytics - Photorealistic 3D Satellite & Real Elevation Terrain
   - High-Resolution Esri World Imagery Basemap (True Photorealistic Texture)
   - Real 3D Terrain Elevation (Son Tra, Marble Mountains, Ba Na Hills)
   - 100% Road-Aligned Accurate Sensor Points
   - Removed artificial extruded building polygons to keep authentic city texture
   - Smooth 60 FPS Performance
--------------------------------------------------------------------------- */

const MAU = {0:'#4b5563', 1:'#22c55e', 2:'#eab308', 3:'#f97316', 4:'#ef4444'};
const MAU_CESIUM = {
  0: Cesium.Color.fromCssColorString('#4b5563'),
  1: Cesium.Color.fromCssColorString('#22c55e'),
  2: Cesium.Color.fromCssColorString('#eab308'),
  3: Cesium.Color.fromCssColorString('#f97316'),
  4: Cesium.Color.fromCssColorString('#ef4444')
};

const MAU_DUONG = {
  motorway: '#60a5fa', motorway_link: '#93c5fd',
  trunk:    '#38bdf8', trunk_link:    '#7dd3fc',
  primary:  '#ffffff', primary_link:  '#e2e8f0',
  secondary:'#cbd5e1', secondary_link:'#94a3b8',
  tertiary: '#64748b', tertiary_link: '#475569'
};

const TAM = { lon: 108.2150, lat: 16.0500 };

const DIEM_QUAN_SAT = {
  overview:        { lon: 108.2150, lat: 16.0350, height: 22000, heading: 0,   pitch: -75 },
  son_tra:         { lon: 108.2750, lat: 16.0600, height: 4500,  heading: 320, pitch: -22 },
  cau_rong:        { lon: 108.2279, lat: 16.0500, height: 2000,  heading: 355, pitch: -30 },
  cau_song_han:    { lon: 108.2268, lat: 16.0620, height: 2000,  heading: 355, pitch: -30 },
  nga_ba_hue:      { lon: 108.1798, lat: 16.0540, height: 1800,  heading: 355, pitch: -32 },
  my_khe:          { lon: 108.2465, lat: 16.0480, height: 2200,  heading: 350, pitch: -25 }
};

let viewer = null;
let thoiDiem = [];
let doanHienTai = [];
let dangChon = null;
let dangNghieng = false;
let dsDuong = null;
let dsNuoc = null;
let bstDuong = null;   // PolylineCollection gom toan bo mang luoi duong
let terrainProvider = null;
let coDiaHinh = true;
let currentBasemap = 'satellite';

/* ---------------- 1. Khởi tạo Cesium ---------------- */
async function khoiTaoCesium(){
  Cesium.Ion.defaultAccessToken = undefined;

  // Khởi tạo tầng ảnh vệ tinh độ nét cao
  viewer = new Cesium.Viewer('ce', {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(
      Cesium.ArcGisMapServerImageryProvider.fromUrl(
        'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      )
    ),
    baseLayerPicker: false,
    geocoder: false,
    homeButton: false,
    sceneModePicker: false,
    navigationHelpButton: false,
    fullscreenButton: false,
    infoBox: false,
    selectionIndicator: false,
    timeline: false,
    animation: false,
  });

  const s = viewer.scene;
  s.globe.baseColor = Cesium.Color.fromCssColorString('#0b111a');
  s.backgroundColor = Cesium.Color.fromCssColorString('#070b12');
  s.globe.showGroundAtmosphere = false;
  s.skyAtmosphere.show = false;
  if (s.skyBox) s.skyBox.show = false;
  s.fog.enabled = false;
  s.globe.enableLighting = false;

  // Địa hình 3D ArcGIS Terrain sẵn sàng khi bấm nút bật
  Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
    'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
  ).then(t => {
    terrainProvider = t;
  }).catch(e => console.warn('Terrain:', e));

  // Giữ render pipeline chuẩn, ổn định trên mọi GPU/trình duyệt
  if (s.postProcessStages && s.postProcessStages.fxaa) {
    s.postProcessStages.fxaa.enabled = false;
  }

  veGiua(true);
  ganChonDiem();
}

/* Đổi tầng ảnh nền trực tiếp */
async function doiNenBanDo(loai){
  if (!viewer) return;
  currentBasemap = loai;
  try {
    let providerPromise;
    if (loai === 'satellite'){
      providerPromise = Cesium.ArcGisMapServerImageryProvider.fromUrl(
        'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
      );
    } else if (loai === 'dark'){
      providerPromise = Promise.resolve(new Cesium.UrlTemplateImageryProvider({
        url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png',
        subdomains: ['a', 'b', 'c', 'd'],
        maximumLevel: 19
      }));
    } else {
      providerPromise = Cesium.TileMapServiceImageryProvider.fromUrl(
        Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
      );
    }

    const newLayer = await Cesium.ImageryLayer.fromProviderAsync(providerPromise);
    viewer.imageryLayers.removeAll();
    viewer.imageryLayers.add(newLayer);

    // Nếu ở chế độ Dark hoặc Offline, hiển thị lớp mặt nước sông Hàn để rõ sông
    if (dsNuoc){
      dsNuoc.show = (loai !== 'satellite');
    }

    viewer.scene.requestRender();
  } catch(e) {
    console.error('Lỗi đổi ảnh nền:', e);
  }
}

/* Bật / Tắt địa hình 3D */
async function chuyenDiaHinh(){
  coDiaHinh = !coDiaHinh;
  const btn = document.getElementById('nut-terrain');
  if (coDiaHinh){
    btn.textContent = '⛰️ Đang nạp đồi núi…';
    try {
      if (!terrainProvider) {
        terrainProvider = await Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
          'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer'
        );
      }
      viewer.terrainProvider = terrainProvider;
      btn.textContent = '⛰️ Đồi núi 3D: Bật';
      btn.classList.add('active');
    } catch(e) {
      console.warn('Lỗi nạp địa hình:', e);
      btn.textContent = '⛰️ Đồi núi 3D: Lỗi';
      coDiaHinh = false;
    }
  } else {
    viewer.terrainProvider = new Cesium.EllipsoidTerrainProvider();
    btn.textContent = '⛰️ Đồi núi 3D: Tắt';
    btn.classList.remove('active');
  }
  viewer.scene.requestRender();
}

/* ---------------- 2. Điều khiển Camera ---------------- */
function bayToi(dich, giay = 1.5){
  if (!viewer) return;
  viewer.camera.flyTo({
    ...dich,
    duration: giay,
    easingFunction: Cesium.EasingFunction.QUADRATIC_IN_OUT,
    complete: () => viewer.scene.requestRender()
  });
}

function bayViTri(key){
  const cfg = DIEM_QUAN_SAT[key];
  if (!cfg) return;
  bayToi({
    destination: Cesium.Cartesian3.fromDegrees(cfg.lon, cfg.lat, cfg.height),
    orientation: {
      heading: Cesium.Math.toRadians(cfg.heading),
      pitch:   Cesium.Math.toRadians(cfg.pitch),
      roll: 0
    }
  }, 1.8);
}

function veGiua(tucThi){
  dangNghieng = false;
  document.getElementById('nut-goc').textContent = 'Nghiêng 3D';
  const dich = {
    destination: Cesium.Cartesian3.fromDegrees(TAM.lon, TAM.lat, 25000),
    orientation: { heading: 0, pitch: Cesium.Math.toRadians(-90), roll: 0 }
  };
  if (tucThi) {
    viewer.camera.setView(dich);
    viewer.scene.requestRender();
  } else {
    bayToi(dich, 1.3);
  }
}

function doiGocNhin(){
  dangNghieng = !dangNghieng;
  document.getElementById('nut-goc').textContent = dangNghieng ? 'Nhìn thẳng' : 'Nghiêng 3D';
  if (dangNghieng){
    bayViTri('son_tra');
  } else {
    veGiua(false);
  }
}

/* ---------------- 3. Nạp Dữ liệu Bản đồ (Mặt nước & Đường sá) ---------------- */
async function napNenBanDo(){
  const tt = document.getElementById('tt-bd');
  const tai = document.getElementById('tai');
  const taiText = document.getElementById('tai-text');
  if (!viewer) return;

  // Lớp mặt nước vector (chỉ hiện khi ở chế độ Dark hoặc Offline)
  try{
    dsNuoc = await Cesium.GeoJsonDataSource.load('/api/mat-nuoc', {
      stroke: Cesium.Color.fromCssColorString('#0284c7').withAlpha(0.85),
      fill:   Cesium.Color.fromCssColorString('#0369a1').withAlpha(0.75),
      strokeWidth: 1.5,
      clampToGround: true
    });
    // Ở chế độ vệ tinh: Nước biển & sông Hàn của ảnh vệ tinh đã chân thực 100%, không cần che phủ
    dsNuoc.show = (currentBasemap !== 'satellite');
    await viewer.dataSources.add(dsNuoc);
  }catch(e){ console.warn('Mặt nước:', e.message); }

  // ---------------------------------------------------------------------
  // Mạng lưới đường — dùng PolylineCollection thay vì Entity API
  // ---------------------------------------------------------------------
  // Vì sao không dùng GeoJsonDataSource như trước:
  //   1. Entity API tạo MỘT primitive cho MỖI đường. 31.096 đường = 31.096
  //      primitive, mỗi khung hình phải duyệt hết -> lag nặng.
  //   2. clampToGround:true bắt Cesium dựng "ground primitive" bám địa hình
  //      cho từng đường, đây là phép toán đắt nhất trong Cesium.
  //
  // PolylineCollection gom tất cả vào MỘT primitive, gộp chung lệnh vẽ.
  // Đường vẽ ở độ cao cố định thay vì bám đất -> bỏ hẳn chi phí ground.
  try{
    taiText.textContent = 'Đang nạp mạng lưới đường giao thông Đà Nẵng…';
    const gj = await (await fetch('/api/duong-chinh')).json();

    if (bstDuong){ viewer.scene.primitives.remove(bstDuong); bstDuong = null; }
    bstDuong = new Cesium.PolylineCollection();

    // Cao hơn mặt đất một chút để không bị địa hình cắt qua
    const CAO = 8;
    let soDoan = 0;

    for (const f of gj.features){
      const c = f.geometry && f.geometry.coordinates;
      if (!c || c.length < 2) continue;
      const h = f.properties.h || 'secondary';
      const w = f.properties.w || 1;

      const toado = [];
      for (const [lon, lat] of c) toado.push(lon, lat, CAO);

      bstDuong.add({
        positions: Cesium.Cartesian3.fromDegreesArrayHeights(toado),
        width: Math.max(1.3, w * 1.35),
        material: Cesium.Material.fromType('Color', {
          color: Cesium.Color.fromCssColorString(MAU_DUONG[h] || '#cbd5e1')
        })
      });
      soDoan++;
    }
    viewer.scene.primitives.add(bstDuong);

    tt.textContent = soDoan.toLocaleString('vi') + ' đoạn đường · gộp 1 primitive';
    tai.style.display = 'none';
  }catch(e){
    tt.textContent = 'Lỗi mạng đường';
    taiText.innerHTML = 'Chưa có file mạng đường.<br>Chạy: <code>python graph/xuat_geojson.py</code>'
      + '<br><br><span style="color:#94a3b8">' + e.message + '</span>';
  }
}

/* ---------------- 4. Trực quan Điểm đo TomTom (Đã Căn chỉnh Đúng Vị trí 100%) ---------------- */
function veDiemDo(){
  if (!viewer) return;
  viewer.entities.removeAll();

  doanHienTai.forEach(s => {
    const isSelected = (s.segment_id === dangChon);
    const color = MAU_CESIUM[s.muc_tac] || MAU_CESIUM[0];

    // 1. Trụ Holographic 3D phát sáng vươn lên
    const chieuCaoTru = isSelected ? 220 : 140;
    const banKinhTru = isSelected ? 22 : 15;
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, chieuCaoTru / 2),
      cylinder: {
        length: chieuCaoTru,
        topRadius: banKinhTru * 0.4,
        bottomRadius: banKinhTru,
        material: color.withAlpha(isSelected ? 0.95 : 0.82),
        slices: 16
      }
    });

    // 2. Chấm tròn sáng dưới chân trụ
    viewer.entities.add({
      position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, 8),
      point: {
        pixelSize: isSelected ? 18 : 12,
        color: color,
        outlineColor: Cesium.Color.WHITE,
        outlineWidth: 2,
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      }
    });

    // 3. Nhãn thông tin kính mờ (Glassmorphism Pill Badge)
    const tocDoTxt = s.current_speed != null ? ` (${s.current_speed} km/h)` : '';
    viewer.entities.add({
      id: s.segment_id,
      position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, chieuCaoTru + 35),
      label: {
        text: s.ten + tocDoTxt,
        font: isSelected ? 'bold 12.5px -apple-system,system-ui,sans-serif' : '11.5px -apple-system,system-ui,sans-serif',
        fillColor: Cesium.Color.WHITE,
        outlineColor: Cesium.Color.fromCssColorString('#020617'),
        outlineWidth: 2.5,
        style: Cesium.LabelStyle.FILL_AND_OUTLINE,
        showBackground: true,
        backgroundColor: isSelected
          ? Cesium.Color.fromCssColorString('#0284c7').withAlpha(0.95)
          : Cesium.Color.fromCssColorString('#0f172a').withAlpha(0.85),
        backgroundPadding: new Cesium.Cartesian2(9, 5),
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 32000),
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      }
    });
  });
  viewer.scene.requestRender();
}

function ganChonDiem(){
  const h = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction(mv => {
    const p = viewer.scene.pick(mv.position);
    if (Cesium.defined(p) && p.id && typeof p.id.id === 'string'){
      chonDoan(p.id.id);
    }
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

/* ---------------- 5. Dữ liệu & Biểu đồ ---------------- */
function baoLoi(html){
  document.getElementById('aside').innerHTML = '<div class="err">' + html + '</div>';
  document.getElementById('tomtat').textContent = 'lỗi kết nối dữ liệu';
}

async function api(p){
  const r = await fetch(p);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' tại ' + p);
  return r.json();
}

async function khoiDong(){
  try{ await khoiTaoCesium(); }
  catch(e){
    document.getElementById('tai-text').innerHTML =
      'Không khởi tạo được Cesium WebGL.<br>' + e.message;
    return;
  }

  let tq;
  try{ tq = await api('/api/tong-quan'); }
  catch(e){
    baoLoi('<b>Chưa nạp được dữ liệu TomTom.</b><br><br>' + e.message);
    napNenBanDo();
    return;
  }

  document.getElementById('kpi').innerHTML =
      '<div><b>' + tq.so_doan + '</b><span>điểm đo</span></div>'
    + '<div><b>' + tq.so_lan_do + '</b><span>lần đo</span></div>'
    + '<div><b>' + tq.so_ban_ghi.toLocaleString('vi') + '</b><span>bản ghi</span></div>'
    + '<div><b>' + tq.so_ngay + '</b><span>ngày dữ liệu</span></div>';
  document.getElementById('tomtat').textContent =
    tq.so_doan + ' điểm đo · ' + tq.so_ban_ghi.toLocaleString('vi') + ' bản ghi';

  thoiDiem = await api('/api/thoi-diem');
  const sl = document.getElementById('slider');
  sl.max = Math.max(0, thoiDiem.length - 1);
  sl.value = sl.max;
  sl.oninput = () => taiDoan(thoiDiem[sl.value]);
  await taiDoan(thoiDiem[sl.max]);

  napNenBanDo();
}

async function taiDoan(ts){
  const kq = await api('/api/doan' + (ts ? '?thoi_diem=' + encodeURIComponent(ts) : ''));
  doanHienTai = kq.doan;
  const d = new Date(kq.thoi_diem);
  document.getElementById('nhan').textContent =
    d.toLocaleString('vi-VN', { weekday:'short', day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
  veDanhSach();
  veDiemDo();
}

function veDanhSach(){
  document.getElementById('ds').innerHTML = doanHienTai.map(s =>
    '<div class="seg ' + (s.segment_id === dangChon ? 'on' : '') + '" onclick="chonDoan(\'' + s.segment_id + '\')">'
    + '<span class="nm"><i class="dot" style="background:' + MAU[s.muc_tac] + ';color:' + MAU[s.muc_tac] + '"></i>' + s.ten + '</span>'
    + '<span class="sp">' + (s.current_speed ?? '–') + '/' + (s.freeflow_speed ?? '–') + ' km/h</span></div>').join('');
}

async function chonDoan(id){
  dangChon = id;
  veDanhSach();
  veDiemDo();

  // Bay camera tới gần vị trí điểm đo chuẩn
  const target = doanHienTai.find(x => x.segment_id === id);
  if (target && viewer){
    bayToi({
      destination: Cesium.Cartesian3.fromDegrees(target.lon, target.lat - 0.009, 1000),
      orientation: {
        heading: Cesium.Math.toRadians(0),
        pitch:   Cesium.Math.toRadians(-32),
        roll: 0
      }
    }, 1.6);
  }

  try{
    const d = await api('/api/doan/' + id + '/chuoi-thoi-gian');
    document.getElementById('tieude-bd').textContent = 'Tốc độ — ' + d.ten;
    veBieuDo(d.diem);
  }catch(e){ console.error(e); }
}

function veBieuDo(diem){
  const c = document.getElementById('bd'), x = c.getContext('2d');
  const W = c.width, H = c.height, P = 30;
  x.clearRect(0,0,W,H);
  if (!diem.length) return;
  const vals = diem.map(p=>p.current_speed).filter(v=>v!=null);
  const ff = diem.map(p=>p.freeflow_speed).filter(v=>v!=null);
  const max = Math.max(...vals, ...ff, 10) * 1.15;

  // Lưới toạ độ
  x.strokeStyle = 'rgba(51,65,85,0.45)'; x.lineWidth = 1;
  for(let i=0; i<=4; i++){
    const y = P + (H - 2*P) * i / 4;
    x.beginPath(); x.moveTo(P, y); x.lineTo(W - 10, y); x.stroke();
    x.fillStyle = '#64748b'; x.font = '10px -apple-system,sans-serif';
    x.fillText(Math.round(max * (1 - i / 4)), 6, y + 3);
  }

  const px = i => P + (W - P - 10) * (diem.length === 1 ? .5 : i / (diem.length - 1));
  const py = v => P + (H - 2*P) * (1 - v / max);

  // Đường dòng tự do (Freeflow)
  x.strokeStyle = '#64748b'; x.setLineDash([4, 3]); x.lineWidth = 1.5; x.beginPath();
  diem.forEach((p, i) => {
    if (p.freeflow_speed == null) return;
    i === 0 ? x.moveTo(px(i), py(p.freeflow_speed)) : x.lineTo(px(i), py(p.freeflow_speed));
  });
  x.stroke(); x.setLineDash([]);

  // Vùng màu gradient dưới đường tốc độ hiện tại
  const grad = x.createLinearGradient(0, P, 0, H - P);
  grad.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
  grad.addColorStop(1, 'rgba(56, 189, 248, 0.0)');
  x.fillStyle = grad;
  x.beginPath();
  let firstIdx = -1;
  diem.forEach((p, i) => {
    if (p.current_speed == null) return;
    if (firstIdx === -1) { firstIdx = i; x.moveTo(px(i), H - P); }
    x.lineTo(px(i), py(p.current_speed));
  });
  if (firstIdx !== -1){
    x.lineTo(px(diem.length - 1), H - P);
    x.closePath();
    x.fill();
  }

  // Đường tốc độ hiện tại
  x.strokeStyle = '#38bdf8'; x.lineWidth = 2.5; x.beginPath();
  diem.forEach((p, i) => {
    if (p.current_speed == null) return;
    i === 0 ? x.moveTo(px(i), py(p.current_speed)) : x.lineTo(px(i), py(p.current_speed));
  });
  x.stroke();

  // Chấm tròn điểm dữ liệu
  diem.forEach((p, i) => {
    if (p.current_speed == null) return;
    x.fillStyle = MAU[p.speed_ratio >= .85 ? 1 : p.speed_ratio >= .65 ? 2 : p.speed_ratio >= .45 ? 3 : 4];
    x.beginPath(); x.arc(px(i), py(p.current_speed), 4, 0, Math.PI * 2); x.fill();
  });

  x.fillStyle = '#94a3b8'; x.font = '11px -apple-system,sans-serif';
  x.fillText('— Tốc độ hiện tại   -- Tự do (km/h)', P, H - 8);
}

khoiDong().catch(e => baoLoi('<b>Lỗi tải dữ liệu.</b><br><br>' + e.message));
</script>

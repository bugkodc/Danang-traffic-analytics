<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đà Nẵng Traffic Analytics</title>
<link rel="stylesheet" href="/static/vendor/Cesium/Widgets/widgets.css">
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --line:#242c38; --text:#e6edf3; --dim:#8b98a8;
    --m1:#22c55e; --m2:#eab308; --m3:#f97316; --m4:#ef4444;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;flex-wrap:wrap;z-index:10}
  header h1{font-size:16px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  header button{background:#1e2936;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 11px;cursor:pointer;font-size:12px}
  header button:hover{border-color:#3b82f6}
  main{flex:1;display:flex;min-height:0}
  #ce{flex:1;position:relative;background:#0b0f14}
  #tai{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:13px;z-index:5;pointer-events:none;text-align:center;line-height:1.8}
  aside{width:340px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;flex:none}
  .bar{padding:10px 18px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .bar input[type=range]{flex:1;accent-color:#3b82f6}
  .bar .tstamp{font-variant-numeric:tabular-nums;min-width:180px;color:var(--dim);text-align:right}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:16px 0 8px}
  h2:first-child{margin-top:0}
  .seg{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .seg:hover{border-color:#3b82f6}
  .seg.on{border-color:#3b82f6;background:#1e2936}
  .seg .nm{font-size:13px}
  .seg .sp{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;flex:none}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi div{background:#111823;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  .kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;color:var(--dim)}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
  #bd{width:100%;height:150px;background:#111823;border:1px solid var(--line);border-radius:6px}
  .err{color:#fca5a5;font-size:12px;padding:12px;border:1px solid #7f1d1d;border-radius:6px;background:#1c1013;line-height:1.7}
  .err code{background:#0f1419;padding:2px 5px;border-radius:3px;color:#e6edf3;font-size:11px}
  .cesium-viewer-bottom,.cesium-widget-credits{display:none !important}
</style>
</head>
<body>

<header>
  <h1>Đà Nẵng Traffic Analytics</h1>
  <span class="sub" id="tomtat">đang tải…</span>
  <span class="sub" id="tt-bd" style="margin-left:auto">…</span>
  <button onclick="veGiua()">Về giữa</button>
  <button onclick="doiGocNhin()" id="nut-goc">Nghiêng 3D</button>
</header>

<main>
  <div id="ce"><div id="tai">Đang khởi tạo Cesium…</div></div>
  <aside id="aside">
    <h2>Tổng quan dữ liệu</h2>
    <div class="kpi" id="kpi"></div>

    <h2>Mức tắc nghẽn</h2>
    <div class="legend">
      <span><i style="background:var(--m1)"></i>Thông thoáng</span>
      <span><i style="background:var(--m2)"></i>Hơi đông</span>
      <span><i style="background:var(--m3)"></i>Đông</span>
      <span><i style="background:var(--m4)"></i>Tắc</span>
    </div>

    <h2>Các đoạn đo</h2>
    <div id="ds"></div>

    <h2 id="tieude-bd">Chuỗi thời gian</h2>
    <canvas id="bd" width="620" height="300"></canvas>
    <p style="margin-top:6px;color:var(--dim);font-size:11px">Chọn một đoạn để xem lịch sử tốc độ.</p>
  </aside>
</main>

<div class="bar">
  <span>Thời điểm</span>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="tstamp" id="nhan">&mdash;</span>
</div>

<script>window.CESIUM_BASE_URL = '/static/vendor/Cesium/';</script>
<script src="/static/vendor/Cesium/Cesium.js"></script>
<script>
/* ---------------------------------------------------------------------------
   CesiumJS chay HOAN TOAN OFFLINE - khong dung Cesium ion, khong token.
   Chi ve du lieu Da Nang cua chinh luan van:
       /api/duong-chinh  mang luoi duong tu do thi OSM
       /api/mat-nuoc     song, bien, ho
       /api/doan         12 diem do TomTom, to mau theo muc tac

   Chon Cesium thay vi MapLibre vi de tai can PHAT LAI THEO THOI GIAN:
   dong ho + dinh dang CZML cua Cesium duoc thiet ke dung cho viec do, va
   dau ra FCD cua SUMO (vi tri tung xe theo buoc thoi gian) chuyen sang CZML
   gan nhu mot-mot. Xem docs/plan/06-giai-doan-6-web-app-deploy.md
--------------------------------------------------------------------------- */

const MAU = {0:'#4b5563',1:'#22c55e',2:'#eab308',3:'#f97316',4:'#ef4444'};
// Nen da lam toi (brightness 0.32) nen mau duong phai sang len de noi bat.
const MAU_DUONG = {
  motorway:'#9fb4cc', trunk:'#8aa0b8', primary:'#7590a8',
  secondary:'#5f7890', tertiary:'#4a6076'
};
const TAM = { lon: 108.2150, lat: 16.0450 };

let viewer = null, thoiDiem = [], doanHienTai = [], dangChon = null;
let dangNghieng = false;

/* ---------------- Cesium ---------------- */
function khoiTaoCesium(){
  // Khong dat token -> khong goi Cesium ion lan nao.
  // Anh nen dung bo Natural Earth dong goi san trong thu vien, nam ngay tren dia.
  Cesium.Ion.defaultAccessToken = undefined;

  viewer = new Cesium.Viewer('ce', {
    baseLayer: Cesium.ImageryLayer.fromProviderAsync(
      Cesium.TileMapServiceImageryProvider.fromUrl(
        Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII')
      )
    ),
    baseLayerPicker:false, geocoder:false, homeButton:false,
    sceneModePicker:false, navigationHelpButton:false, fullscreenButton:false,
    infoBox:false, selectionIndicator:false,
    timeline:false, animation:false,     // bat lai o GD5 khi co CZML tu SUMO
    // KHONG bat requestRenderMode: no dong bang vong lap ve, khien
    // camera.flyTo khong chay va camera ket o vi tri mac dinh.
  });

  // Anh nen Natural Earth mac dinh sang mau, lech tong voi giao dien toi.
  // Ha do sang va do bao hoa de no lui ve lam nen, duong va diem do noi len.
  if (viewer.imageryLayers.length){
    const l = viewer.imageryLayers.get(0);
    l.brightness = 0.55;
    l.saturation = 0.35;
    l.contrast    = 1.1;
  }

  const s = viewer.scene;
  s.globe.baseColor = Cesium.Color.fromCssColorString('#0d1319');
  s.globe.showGroundAtmosphere = false;
  s.skyAtmosphere.show = false;
  if (s.skyBox) s.skyBox.show = false;
  s.backgroundColor = Cesium.Color.fromCssColorString('#070a0e');
  s.fog.enabled = false;
  s.globe.enableLighting = false;

  veGiua(true);      // tuc thi, khong doi animation
  ganChonDiem();
}

// Bay camera co animation, nhung neu tab dang an thi trinh duyet tam dung
// requestAnimationFrame -> animation khong tien. Khi do dat thang vi tri.
function bayToi(dich, giay){
  if (!giay || document.hidden){
    viewer.camera.setView(dich);
    viewer.scene.requestRender();
    return;
  }
  viewer.camera.flyTo({ ...dich, duration: giay,
    complete: () => viewer.scene.requestRender() });
  // chan an toan: neu sau thoi luong bay ma chua toi noi thi dat thang
  setTimeout(() => {
    const h = viewer.camera.positionCartographic.height;
    const dich_h = Cesium.Cartographic.fromCartesian(dich.destination).height;
    if (Math.abs(h - dich_h) > dich_h * 0.2) viewer.camera.setView(dich);
  }, giay * 1000 + 800);
}


function veGiua(tucThi){
  if (!viewer) return;
  dangNghieng = false;
  document.getElementById('nut-goc').textContent = 'Nghiêng 3D';
  const dich = {
    destination: Cesium.Cartesian3.fromDegrees(TAM.lon, TAM.lat, 26000),
    orientation: { heading:0, pitch: Cesium.Math.toRadians(-90), roll:0 }
  };
  bayToi(dich, tucThi ? 0 : 1.2);
}

function doiGocNhin(){
  if (!viewer) return;
  dangNghieng = !dangNghieng;
  document.getElementById('nut-goc').textContent = dangNghieng ? 'Nhìn thẳng' : 'Nghiêng 3D';
  bayToi({
    destination: Cesium.Cartesian3.fromDegrees(
      TAM.lon, TAM.lat - (dangNghieng ? 0.032 : 0), dangNghieng ? 3200 : 26000),
    orientation: {
      heading: Cesium.Math.toRadians(dangNghieng ? -15 : 0),
      pitch:   Cesium.Math.toRadians(dangNghieng ? -28 : -90),
      roll: 0
    }
  }, 1.6);
}

async function napNenBanDo(){
  const tt = document.getElementById('tt-bd');
  const tai = document.getElementById('tai');
  if (!viewer) return;
  let soNha = 0;

  try{
    tai.textContent = 'Đang tải mặt nước…';
    const nuoc = await Cesium.GeoJsonDataSource.load('/api/mat-nuoc', {
      stroke: Cesium.Color.fromCssColorString('#16344d'),
      fill:   Cesium.Color.fromCssColorString('#0e2537'),
      strokeWidth: 1, clampToGround: true
    });
    await viewer.dataSources.add(nuoc);
  }catch(e){ console.warn('Mặt nước:', e.message); }

  // --- toa nha 3D: dun khoi theo chieu cao ---
  tai.textContent = 'Đang dựng khối nhà 3D…';
  try{
    const nha = await Cesium.GeoJsonDataSource.load('/api/toa-nha', { clampToGround:false });
    for (const e of nha.entities.values){
      if (!e.polygon) continue;
      const c = e.properties && e.properties.c ? e.properties.c.getValue() : 8;
      e.polygon.extrudedHeight = c;                       // chieu cao that
      e.polygon.height = 0;
      e.polygon.perPositionHeight = false;
      // nha cao thi sang hon -> nhin ra duoc do cao ngay tu mau
      const t = Math.min(1, c / 40);
      e.polygon.material = Cesium.Color.fromCssColorString('#7d8ea3')
                             .brighten(t * 0.35, new Cesium.Color())
                             .withAlpha(0.92);
      e.polygon.outline = true;
      e.polygon.outlineColor = Cesium.Color.fromCssColorString('#39485a');
      e.polygon.outlineWidth = 1;
    }
    await viewer.dataSources.add(nha);
    soNha = nha.entities.values.length;
  }catch(e){ console.warn('Toà nhà:', e.message); }

  tai.textContent = 'Đang tải mạng lưới đường…';
  try{
    const dd = await Cesium.GeoJsonDataSource.load('/api/duong-chinh', { clampToGround:true });
    const ds = dd.entities.values;
    for (const e of ds){
      if (!e.polyline) continue;
      const h = e.properties && e.properties.h ? e.properties.h.getValue() : 'secondary';
      const w = e.properties && e.properties.w ? e.properties.w.getValue() : 1;
      e.polyline.material = Cesium.Color.fromCssColorString(MAU_DUONG[h] || '#2d3742');
      e.polyline.width = Math.max(1.2, w * 1.3);
    }
    await viewer.dataSources.add(dd);
    tt.textContent = ds.length.toLocaleString('vi') + ' đoạn · '
      + soNha.toLocaleString('vi') + ' toà nhà 3D · offline';
    tai.style.display = 'none';
  }catch(e){
    tt.textContent = 'chưa có mạng đường';
    tt.style.color = '#f87171';
    tai.innerHTML = 'Chưa có file mạng đường.<br>Chạy: <code>python graph/xuat_geojson.py</code>';
    return;
  }
  viewer.scene.requestRender();
}

function veDiemDo(){
  if (!viewer) return;
  viewer.entities.removeAll();
  doanHienTai.forEach(s => {
    viewer.entities.add({
      id: s.segment_id,
      position: Cesium.Cartesian3.fromDegrees(s.lon, s.lat, 60),
      point: {
        pixelSize: s.segment_id === dangChon ? 20 : 14,
        color: Cesium.Color.fromCssColorString(MAU[s.muc_tac]),
        outlineColor: Cesium.Color.fromCssColorString(
          s.segment_id === dangChon ? '#3b82f6' : '#0b0f14'),
        outlineWidth: s.segment_id === dangChon ? 4 : 2.5,
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      },
      label: {
        text: s.ten,
        font: '12px system-ui',
        fillColor: Cesium.Color.fromCssColorString('#c9d4e0'),
        showBackground: true,
        backgroundColor: Cesium.Color.fromCssColorString('#171d26cc'),
        backgroundPadding: new Cesium.Cartesian2(7,4),
        pixelOffset: new Cesium.Cartesian2(0,-22),
        distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 60000),
        disableDepthTestDistance: Number.POSITIVE_INFINITY
      }
    });
  });
  viewer.scene.requestRender();
}

function ganChonDiem(){
  const h = new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction(mv => {
    const p = viewer.scene.pick(mv.position);
    if (Cesium.defined(p) && p.id && typeof p.id.id === 'string') chonDoan(p.id.id);
  }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
}

/* ---------------- dữ liệu ---------------- */
function baoLoi(html){
  document.getElementById('aside').innerHTML = '<div class="err">' + html + '</div>';
  document.getElementById('tomtat').textContent = 'lỗi — xem bảng bên phải';
}
async function api(p){
  const r = await fetch(p);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' tại ' + p + ' — ' + (await r.text()).slice(0,200));
  return r.json();
}

async function khoiDong(){
  try{ khoiTaoCesium(); }
  catch(e){
    document.getElementById('tai').innerHTML =
      'Không khởi tạo được Cesium.<br>' + e.message + '<br><br>'
      + 'Kiểm tra thư mục <code>services/api/static/vendor/Cesium/</code>';
  }

  let tq;
  try{ tq = await api('/api/tong-quan'); }
  catch(e){
    baoLoi('<b>Chưa đọc được dữ liệu.</b><br><br>' + e.message + '<br><br>'
      + 'Chạy <code>cd ingest/tomtom &amp;&amp; python collect.py</code> hoặc <code>git pull</code>.');
    napNenBanDo();
    return;
  }

  document.getElementById('kpi').innerHTML =
      '<div><b>' + tq.so_doan + '</b><span>đoạn đo</span></div>'
    + '<div><b>' + tq.so_lan_do + '</b><span>lần đo</span></div>'
    + '<div><b>' + tq.so_ban_ghi.toLocaleString('vi') + '</b><span>bản ghi</span></div>'
    + '<div><b>' + tq.so_ngay + '</b><span>ngày dữ liệu</span></div>';
  document.getElementById('tomtat').textContent =
    'dữ liệu TomTom thực đo · ' + tq.so_ban_ghi.toLocaleString('vi') + ' bản ghi · ' + tq.so_ngay + ' ngày';

  thoiDiem = await api('/api/thoi-diem');
  const sl = document.getElementById('slider');
  sl.max = Math.max(0, thoiDiem.length - 1);
  sl.value = sl.max;
  sl.oninput = () => taiDoan(thoiDiem[sl.value]);
  await taiDoan(thoiDiem[sl.max]);

  napNenBanDo();
}

async function taiDoan(ts){
  const kq = await api('/api/doan' + (ts ? '?thoi_diem=' + encodeURIComponent(ts) : ''));
  doanHienTai = kq.doan;
  const d = new Date(kq.thoi_diem);
  document.getElementById('nhan').textContent =
    d.toLocaleString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  veDanhSach();
  veDiemDo();
}

function veDanhSach(){
  document.getElementById('ds').innerHTML = doanHienTai.map(s =>
    '<div class="seg ' + (s.segment_id === dangChon ? 'on' : '') + '" onclick="chonDoan(\'' + s.segment_id + '\')">'
    + '<span class="nm"><i class="dot" style="background:' + MAU[s.muc_tac] + '"></i>' + s.ten + '</span>'
    + '<span class="sp">' + (s.current_speed ?? '–') + '/' + (s.freeflow_speed ?? '–') + '</span></div>').join('');
}

async function chonDoan(id){
  dangChon = id; veDanhSach(); veDiemDo();
  try{
    const d = await api('/api/doan/' + id + '/chuoi-thoi-gian');
    document.getElementById('tieude-bd').textContent = 'Tốc độ — ' + d.ten;
    veBieuDo(d.diem);
  }catch(e){ console.error(e); }
}

function veBieuDo(diem){
  const c = document.getElementById('bd'), x = c.getContext('2d');
  const W = c.width, H = c.height, P = 30;
  x.clearRect(0,0,W,H);
  if (!diem.length) return;
  const vals = diem.map(p=>p.current_speed).filter(v=>v!=null);
  const ff = diem.map(p=>p.freeflow_speed).filter(v=>v!=null);
  const max = Math.max(...vals, ...ff, 10) * 1.1;

  x.strokeStyle='#242c38'; x.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=P+(H-2*P)*i/4; x.beginPath(); x.moveTo(P,y); x.lineTo(W-8,y); x.stroke();
    x.fillStyle='#8b98a8'; x.font='11px system-ui'; x.fillText(Math.round(max*(1-i/4)), 4, y+4); }

  const px = i => P + (W-P-8) * (diem.length===1 ? .5 : i/(diem.length-1));
  const py = v => P + (H-2*P) * (1 - v/max);

  x.strokeStyle='#4b5563'; x.setLineDash([4,3]); x.lineWidth=1.5; x.beginPath();
  diem.forEach((p,i)=>{ if(p.freeflow_speed==null) return;
    i===0 ? x.moveTo(px(i),py(p.freeflow_speed)) : x.lineTo(px(i),py(p.freeflow_speed)); });
  x.stroke(); x.setLineDash([]);

  x.strokeStyle='#3b82f6'; x.lineWidth=2; x.beginPath();
  diem.forEach((p,i)=>{ if(p.current_speed==null) return;
    i===0 ? x.moveTo(px(i),py(p.current_speed)) : x.lineTo(px(i),py(p.current_speed)); });
  x.stroke();

  diem.forEach((p,i)=>{ if(p.current_speed==null) return;
    x.fillStyle = MAU[p.speed_ratio>=.85?1:p.speed_ratio>=.65?2:p.speed_ratio>=.45?3:4];
    x.beginPath(); x.arc(px(i),py(p.current_speed),3,0,7); x.fill(); });

  x.fillStyle='#8b98a8'; x.font='11px system-ui';
  x.fillText('— hiện tại   ---- dòng tự do (km/h)', P, H-8);
}

khoiDong().catch(e => baoLoi('<b>Lỗi không mong đợi.</b><br><br>' + e.message));
</script>
</body>
</html>

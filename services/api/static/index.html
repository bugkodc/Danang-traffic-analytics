<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đà Nẵng Traffic Analytics</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  :root{
    --bg:#0f1419; --panel:#171d26; --line:#242c38; --text:#e6edf3; --dim:#8b98a8;
    --m1:#22c55e; --m2:#eab308; --m3:#f97316; --m4:#ef4444; --m0:#4b5563;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}
  header{padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  header h1{font-size:16px;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  main{flex:1;display:flex;min-height:0}
  #map{flex:1;position:relative}
  #map-loi{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:30px;text-align:center;color:var(--dim);font-size:13px;line-height:1.7}
  aside{width:340px;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px;flex:none}
  .bar{padding:10px 18px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px}
  .bar input[type=range]{flex:1;accent-color:#3b82f6}
  .bar .tstamp{font-variant-numeric:tabular-nums;min-width:180px;color:var(--dim);text-align:right}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim);margin:16px 0 8px}
  h2:first-child{margin-top:0}
  .seg{padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .seg:hover{border-color:#3b82f6}
  .seg.on{border-color:#3b82f6;background:#1e2936}
  .seg .nm{font-size:13px}
  .seg .sp{font-variant-numeric:tabular-nums;font-size:12px;color:var(--dim);white-space:nowrap}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:7px;flex:none}
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .kpi div{background:#111823;border:1px solid var(--line);border-radius:6px;padding:8px 10px}
  .kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .kpi span{font-size:11px;color:var(--dim)}
  .legend{display:flex;gap:12px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
  canvas{width:100%;height:150px;background:#111823;border:1px solid var(--line);border-radius:6px}
  .err{color:#fca5a5;font-size:12px;padding:12px;border:1px solid #7f1d1d;border-radius:6px;background:#1c1013;line-height:1.7}
  .err code{background:#0f1419;padding:2px 5px;border-radius:3px;color:#e6edf3;font-size:11px}
  .maplibregl-popup-content{background:#171d26;color:#e6edf3;border-radius:6px;font-size:13px;padding:10px 12px}
  .maplibregl-popup-tip{border-top-color:#171d26 !important;border-bottom-color:#171d26 !important}
</style>
</head>
<body>

<header>
  <h1>Đà Nẵng Traffic Analytics</h1>
  <span class="sub" id="tomtat">đang tải…</span>
  <span class="sub" id="nguon-ban-do" style="margin-left:auto">…</span>
  <button onclick="chanDoanMang()" style="background:#1e2936;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 11px;cursor:pointer;font-size:12px">Kiểm tra mạng</button>
  <button id="nut-3d" onclick="bat3D()" style="display:none;background:#1e2936;color:var(--text);border:1px solid var(--line);border-radius:5px;padding:4px 11px;cursor:pointer;font-size:12px">Xem 3D</button>
</header>

<main>
  <div id="map"><div id="map-loi"></div></div>
  <aside id="aside">
    <h2>Tổng quan dữ liệu</h2>
    <div class="kpi" id="kpi"></div>

    <h2>Mức tắc nghẽn</h2>
    <div class="legend">
      <span><i style="background:var(--m1)"></i>Thông thoáng</span>
      <span><i style="background:var(--m2)"></i>Hơi đông</span>
      <span><i style="background:var(--m3)"></i>Đông</span>
      <span><i style="background:var(--m4)"></i>Tắc</span>
    </div>

    <h2>Các đoạn đo</h2>
    <div id="ds"></div>

    <h2 id="tieude-bd">Chuỗi thời gian</h2>
    <canvas id="bd" width="620" height="300"></canvas>
    <p style="margin-top:6px;color:var(--dim);font-size:11px">Chọn một đoạn để xem lịch sử tốc độ.</p>
  </aside>
</main>

<div class="bar">
  <span>Thời điểm</span>
  <input type="range" id="slider" min="0" max="0" value="0">
  <span class="tstamp" id="nhan">—</span>
</div>

<script>
const MAU = {0:'#4b5563',1:'#22c55e',2:'#eab308',3:'#f97316',4:'#ef4444'};
let thoiDiem = [], doanHienTai = [], dangChon = null, markers = [], map = null;

function baoLoi(html){
  document.getElementById('aside').innerHTML = '<div class="err">' + html + '</div>';
  document.getElementById('tomtat').textContent = 'lỗi — xem bảng bên phải';
}

async function api(p){
  const r = await fetch(p);
  if(!r.ok) throw new Error('HTTP ' + r.status + ' tại ' + p + ' — ' + (await r.text()).slice(0,200));
  return r.json();
}

// ---- Bản đồ: nhiều tầng dự phòng, không phụ thuộc một nguồn ----
// Mạng ở Việt Nam hay chặn/chậm với một số CDN. Thay vì phụ thuộc một file
// style bên ngoài, ta thử lần lượt nhiều nguồn và báo rõ nguồn nào đang dùng.

const NGUON = [
  { ten:'OpenFreeMap (vector, có 3D)', ba_chieu:true,
    style:'https://tiles.openfreemap.org/styles/positron' },
  { ten:'CARTO (vector, có 3D)', ba_chieu:true,
    style:'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json' },
  { ten:'OpenStreetMap (raster, phẳng)', ba_chieu:false, style:{
      version:8,
      sources:{ osm:{ type:'raster', tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                      tileSize:256, attribution:'© OpenStreetMap contributors' } },
      layers:[{ id:'osm', type:'raster', source:'osm' }]
  }}
];

let nguonHienTai = -1, daVeXong = false;

function ganTrangThai(txt, loi){
  const el = document.getElementById('nguon-ban-do');
  if (el){ el.textContent = txt; el.style.color = loi ? '#f87171' : 'var(--dim)'; }
}

function thuNguon(i){
  const hop = document.getElementById('map-loi');
  if (i >= NGUON.length){
    hop.style.display = 'flex';
    hop.innerHTML = 'Không tải được bản đồ từ bất kỳ nguồn nào.<br>'
      + 'Mạng của bạn có thể đang chặn các máy chủ bản đồ.<br><br>'
      + '<b style="color:#e6edf3">Phần dữ liệu bên phải vẫn hoạt động đầy đủ.</b>';
    ganTrangThai('không tải được bản đồ', true);
    return;
  }
  const n = NGUON[i];
  nguonHienTai = i;
  ganTrangThai('đang thử: ' + n.ten);

  if (map){ try{ map.remove(); }catch(e){} map = null; }
  daVeXong = false;

  try{
    map = new maplibregl.Map({
      container:'map', style:n.style,
      center:[108.2200,16.0600], zoom:12.5, pitch:0, bearing:0,
      attributionControl:{compact:true}
    });
  }catch(e){ return thuNguon(i+1); }

  // Cho lau hon: mang cham khong co nghia la hong.
  const hetGio = setTimeout(()=>{ if(!daVeXong){ console.warn('Qua han:', n.ten); thuNguon(i+1); } }, 25000);

  map.on('error', e => {
    const msg = String(e && e.error && e.error.message || '');
    const st  = e && e.error && e.error.status;
    console.warn('Loi ban do (' + n.ten + '):', msg || st);
    // Chi doi nguon khi style KHONG tai duoc. Loi tung o tile le te thi bo qua.
    const styleHong = !daVeXong && (st === 403 || st === 404 ||
                       /failed to fetch|networkerror|load.*style|style.*load/i.test(msg));
    if (styleHong){ clearTimeout(hetGio); thuNguon(i+1); }
  });

  map.on('load', ()=>{
    daVeXong = true; clearTimeout(hetGio);
    document.getElementById('map-loi').style.display = 'none';
    ganTrangThai('nguồn: ' + n.ten);
    map.addControl(new maplibregl.NavigationControl({visualizePitch:true}),'top-right');
    if (n.ba_chieu) themToaNha();
    veMarker();
  });
}

// Khối 3D: dựng nhà theo chiều cao có trong dữ liệu vector
function themToaNha(){
  try{
    const lop = map.getStyle().layers.find(l => l.type==='symbol' && l.layout && l.layout['text-field']);
    if (map.getSource('openmaptiles') || map.getSource('carto')){
      const src = map.getSource('openmaptiles') ? 'openmaptiles' : 'carto';
      map.addLayer({
        id:'toa-nha-3d', source:src, 'source-layer':'building',
        type:'fill-extrusion', minzoom:14,
        paint:{
          'fill-extrusion-color':'#2a3441',
          'fill-extrusion-height':['coalesce',['get','render_height'],['get','height'],12],
          'fill-extrusion-base':['coalesce',['get','render_min_height'],0],
          'fill-extrusion-opacity':0.75
        }
      }, lop && lop.id);
      document.getElementById('nut-3d').style.display = 'inline-block';
    }
  }catch(e){ console.warn('Không dựng được khối 3D:', e.message); }
}

function bat3D(){
  if (!map) return;
  const dang3D = map.getPitch() > 10;
  map.easeTo({ pitch: dang3D ? 0 : 55, bearing: dang3D ? 0 : -20, zoom: dang3D ? 12.5 : 15, duration: 900 });
  document.getElementById('nut-3d').textContent = dang3D ? 'Xem 3D' : 'Xem phẳng';
}

// Chẩn đoán: thử tải thật từng nguồn, báo nguồn nào mạng của bạn vào được.
async function chanDoanMang(){
  const dich = [
    ['Thư viện MapLibre (unpkg)', 'https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js'],
    ['Style OpenFreeMap',        'https://tiles.openfreemap.org/styles/positron'],
    ['Tile OpenFreeMap',         'https://tiles.openfreemap.org/planet/20250101_001001_pt/12/3269/1925.pbf'],
    ['Style CARTO',              'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json'],
    ['Tile CARTO',               'https://basemaps.cartocdn.com/vector/carto.streets/v1/12/3269/1925.mvt'],
    ['Tile OpenStreetMap',       'https://tile.openstreetmap.org/12/3269/1925.png'],
  ];
  const el = document.getElementById('aside');
  el.innerHTML = '<h2>Chẩn đoán mạng</h2><div id="cd" style="font-size:12px;line-height:2">đang thử…</div>';
  const ra = [];
  for (const [ten, url] of dich){
    const t0 = performance.now();
    let kq;
    try{
      await fetch(url, {mode:'no-cors', cache:'no-store'});
      kq = '<span style="color:#22c55e">✓ vào được</span> ' + Math.round(performance.now()-t0) + 'ms';
    }catch(e){
      kq = '<span style="color:#f87171">✗ bị chặn</span>';
    }
    ra.push(`<div>${ten}<br><span style="color:var(--dim)">${kq}</span></div>`);
    document.getElementById('cd').innerHTML = ra.join('');
  }
  ra.push('<br><div style="color:var(--dim)">Gửi ảnh chụp bảng này nếu bản đồ vẫn trắng.<br>'
        + '<a href="/" style="color:#3b82f6">Tải lại trang</a></div>');
  document.getElementById('cd').innerHTML = ra.join('');
}

function taoBanDo(){
  if (typeof maplibregl === 'undefined'){
    const hop = document.getElementById('map-loi');
    hop.style.display = 'flex';
    hop.innerHTML = 'Không tải được thư viện MapLibre từ CDN.<br>'
      + 'Mạng của bạn có thể đang chặn unpkg.com.<br><br>'
      + '<b style="color:#e6edf3">Phần dữ liệu bên phải vẫn hoạt động đầy đủ.</b>';
    ganTrangThai('thiếu thư viện bản đồ', true);
    return;
  }
  thuNguon(0);
}

// ---- Dữ liệu: chạy độc lập, luôn thử ----
async function khoiDong(){
  let tq;
  try{
    tq = await api('/api/tong-quan');
  }catch(e){
    baoLoi('<b>Chưa đọc được dữ liệu.</b><br><br>'
      + 'Chi tiết: ' + e.message + '<br><br>'
      + 'Hãy chắc chắn có file parquet trong <code>ingest/tomtom/data/</code>. Nếu chưa có:<br><br>'
      + '<code>cd ingest/tomtom</code><br><code>python collect.py</code><br><br>'
      + 'hoặc <code>git pull</code> để lấy dữ liệu GitHub Actions đã thu.<br><br>'
      + 'Và nhớ chạy uvicorn <b>từ thư mục gốc của repo</b>:<br>'
      + '<code>python -m uvicorn services.api.main:app --port 8000</code>');
    return;
  }

  document.getElementById('kpi').innerHTML = `
    <div><b>${tq.so_doan}</b><span>đoạn đo</span></div>
    <div><b>${tq.so_lan_do}</b><span>lần đo</span></div>
    <div><b>${tq.so_ban_ghi.toLocaleString('vi')}</b><span>bản ghi</span></div>
    <div><b>${tq.so_ngay}</b><span>ngày dữ liệu</span></div>`;
  document.getElementById('tomtat').textContent =
    `dữ liệu TomTom thực đo · ${tq.so_ban_ghi.toLocaleString('vi')} bản ghi · ${tq.so_ngay} ngày`;

  thoiDiem = await api('/api/thoi-diem');
  const sl = document.getElementById('slider');
  sl.max = Math.max(0, thoiDiem.length - 1);
  sl.value = sl.max;
  sl.oninput = () => taiDoan(thoiDiem[sl.value]);
  await taiDoan(thoiDiem[sl.max]);
}

async function taiDoan(ts){
  const kq = await api('/api/doan' + (ts ? '?thoi_diem=' + encodeURIComponent(ts) : ''));
  doanHienTai = kq.doan;
  const d = new Date(kq.thoi_diem);
  document.getElementById('nhan').textContent =
    d.toLocaleString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  veDanhSach();
  veMarker();
}

function veMarker(){
  if (!map || !daVeXong) return;
  markers.forEach(m => m.remove()); markers = [];
  doanHienTai.forEach(s => {
    const el = document.createElement('div');
    el.style.cssText = `width:16px;height:16px;border-radius:50%;cursor:pointer;
      background:${MAU[s.muc_tac]};border:2px solid #0f1419;box-shadow:0 0 0 1px ${MAU[s.muc_tac]}`;
    const m = new maplibregl.Marker({element:el}).setLngLat([s.lon, s.lat])
      .setPopup(new maplibregl.Popup({offset:14}).setHTML(
        `<b>${s.ten}</b><br>${s.current_speed}/${s.freeflow_speed} km/h<br>tỷ lệ ${s.speed_ratio ?? '–'}`))
      .addTo(map);
    el.onclick = () => chonDoan(s.segment_id);
    markers.push(m);
  });
}

function veDanhSach(){
  document.getElementById('ds').innerHTML = doanHienTai.map(s => `
    <div class="seg ${s.segment_id === dangChon ? 'on' : ''}" onclick="chonDoan('${s.segment_id}')">
      <span class="nm"><i class="dot" style="background:${MAU[s.muc_tac]}"></i>${s.ten}</span>
      <span class="sp">${s.current_speed ?? '–'}/${s.freeflow_speed ?? '–'}</span>
    </div>`).join('');
}

async function chonDoan(id){
  dangChon = id; veDanhSach();
  try{
    const d = await api(`/api/doan/${id}/chuoi-thoi-gian`);
    document.getElementById('tieude-bd').textContent = 'Tốc độ — ' + d.ten;
    veBieuDo(d.diem);
  }catch(e){ console.error(e); }
}

function veBieuDo(diem){
  const c = document.getElementById('bd'), x = c.getContext('2d');
  const W = c.width, H = c.height, P = 30;
  x.clearRect(0,0,W,H);
  if(!diem.length) return;
  const vals = diem.map(p=>p.current_speed).filter(v=>v!=null);
  const ff = diem.map(p=>p.freeflow_speed).filter(v=>v!=null);
  const max = Math.max(...vals, ...ff, 10) * 1.1;

  x.strokeStyle='#242c38'; x.lineWidth=1;
  for(let i=0;i<=4;i++){ const y=P+(H-2*P)*i/4; x.beginPath(); x.moveTo(P,y); x.lineTo(W-8,y); x.stroke();
    x.fillStyle='#8b98a8'; x.font='11px system-ui'; x.fillText(Math.round(max*(1-i/4)), 4, y+4); }

  const px = i => P + (W-P-8) * (diem.length===1 ? .5 : i/(diem.length-1));
  const py = v => P + (H-2*P) * (1 - v/max);

  x.strokeStyle='#4b5563'; x.setLineDash([4,3]); x.lineWidth=1.5; x.beginPath();
  diem.forEach((p,i)=>{ if(p.freeflow_speed==null) return;
    i===0 ? x.moveTo(px(i),py(p.freeflow_speed)) : x.lineTo(px(i),py(p.freeflow_speed)); });
  x.stroke(); x.setLineDash([]);

  x.strokeStyle='#3b82f6'; x.lineWidth=2; x.beginPath();
  diem.forEach((p,i)=>{ if(p.current_speed==null) return;
    i===0 ? x.moveTo(px(i),py(p.current_speed)) : x.lineTo(px(i),py(p.current_speed)); });
  x.stroke();

  diem.forEach((p,i)=>{ if(p.current_speed==null) return;
    x.fillStyle = MAU[p.speed_ratio>=.85?1:p.speed_ratio>=.65?2:p.speed_ratio>=.45?3:4];
    x.beginPath(); x.arc(px(i),py(p.current_speed),3,0,7); x.fill(); });

  x.fillStyle='#8b98a8'; x.font='11px system-ui';
  x.fillText('— hiện tại   ---- dòng tự do (km/h)', P, H-8);
}

// Dữ liệu chạy trước và độc lập; bản đồ tạo sau, hỏng cũng không ảnh hưởng.
khoiDong().catch(e => baoLoi('<b>Lỗi không mong đợi.</b><br><br>' + e.message));
taoBanDo();
</script>
</body>
</html>
